<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Usia Klasik</title>
	<link rel="icon" type="image/png" href="logo.png">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="logo.png">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Noto Serif -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- Flatpickr Date Picker Library -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

    <!-- Font Awesome for Gear Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        .flatpickr-calendar,body{font-family:'Noto Serif',serif}body{overflow-x:hidden}.vintage-bg{background-color:beige;background-image:linear-gradient(rgba(240,230,210,.5) .1em,transparent .1em),linear-gradient(90deg,rgba(240,230,210,.5) .1em,transparent .1em);background-size:2em 2em}.paper-container{background-color:#fffaf0;border:1px solid tan;box-shadow:10px 10px 20px rgba(0,0,0,.2),0 0 5px rgba(0,0,0,.1);position:relative;transition:.3s ease-in-out}.flatpickr-calendar{background:#fffaf0;border:1px solid tan;border-radius:8px;box-shadow:5px 5px 15px rgba(0,0,0,.2);color:#854d0e}.flatpickr-day,.flatpickr-months .flatpickr-month,.flatpickr-weekdays{color:#854d0e}.flatpickr-months .flatpickr-next-month:hover svg,.flatpickr-months .flatpickr-prev-month:hover svg{fill:#92400e}.flatpickr-day:focus,.flatpickr-day:hover{background:#fef3c7;border-color:#fef3c7}.flatpickr-day.today{border-color:#d97706}.flatpickr-day.selected{background:#92400e;border-color:#92400e;color:#fff}.arrowDown:hover,.arrowUp:hover,.numInputWrapper:hover{background:#fde68a}.flatpickr-current-month .numInput{color:#854d0e;font-weight:700}.flatpickr-day.flatpickr-disabled{color:tan}@keyframes spin-clockwise{from{transform:rotate(0)}to{transform:rotate(360deg)}}@keyframes spin-counter-clockwise{from{transform:rotate(0)}to{transform:rotate(-360deg)}}.gear-animation-container{min-height:250px}.gears{position:relative;width:150px;height:150px;color:#a16207}.gears .gear{position:absolute;animation-iteration-count:infinite;animation-timing-function:linear}.gear-1{font-size:5rem;top:50%;left:50%;transform:translate(-50%,-50%);animation-name:spin-clockwise;animation-duration:4s}.gear-2,.gear-3{animation-name:spin-counter-clockwise;animation-duration:3s}.gear-2{font-size:3rem;top:8px;left:8px}.gear-3{font-size:2.5rem;bottom:12px;right:12px}
    </style>
</head>
<!-- FIX: Added bottom padding to body to prevent footer from overlapping content -->
<body class="vintage-bg min-h-screen flex items-center justify-center p-4 pb-20">

    <!-- Changed padding for better mobile view -->
    <div class="paper-container w-full max-w-lg md:max-w-2xl lg:max-w-3xl xl:max-w-4xl p-4 sm:p-8 md:p-12 rounded-lg text-center">
        
        <!-- Header Section -->
        <header class="mb-8 border-b-2 border-dashed border-amber-800 pb-4">
            <h1 class="text-3xl sm:text-4xl md:text-5xl font-bold text-amber-900">Mesin Waktu Usia</h1>
            <p class="text-base sm:text-lg text-amber-800 mt-2 italic">Menghitung setiap momen berharga dalam hidup Anda.</p>
        </header>

        <!-- Input Section -->
        <main>
            <div class="mb-6">
                <label for="birthdate" class="block text-lg sm:text-xl text-amber-900 mb-3">Masukkan Tanggal Lahir Anda:</label>
                <input type="text" id="birthdate" placeholder="Pilih tanggal..." class="w-full max-w-sm mx-auto p-3 border-2 border-amber-700 rounded-md bg-transparent text-amber-900 text-lg focus:outline-none focus:ring-2 focus:ring-amber-800 transition-all duration-300 cursor-pointer text-center">
            </div>

            <button id="calculateBtn" class="bg-amber-800 text-white font-bold py-3 px-8 rounded-lg shadow-md hover:bg-amber-900 transition-transform transform hover:scale-105 duration-300 text-xl">
                Hitung
            </button>

            <!-- Message for invalid date -->
            <div id="message" class="mt-4 text-red-700 font-semibold h-6"></div>

            <!-- Loading Animation Section -->
            <div id="loadingAnimation" class="hidden gear-animation-container flex-col items-center justify-center my-8">
                <div class="gears">
                    <i class="fas fa-cog gear gear-1"></i>
                    <i class="fas fa-cog gear gear-2"></i>
                    <i class="fas fa-cog gear gear-3"></i>
                </div>
                <p class="text-xl text-amber-800 mt-4 italic">Mesin waktu sedang bekerja...</p>
            </div>

            <!-- Age Display Section -->
            <div id="ageResult" class="hidden mt-8">
                <h2 class="text-xl sm:text-2xl text-amber-900 font-semibold mb-4">Usia Anda Saat Ini Adalah:</h2>
                <!-- Changed gap for better mobile view -->
                <div id="ageDisplay" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-2 sm:gap-4 text-amber-800">
                    <!-- Age units will be injected here -->
                </div>
            </div>
            
            <!-- Zodiac and Shio Section -->
            <div id="zodiacShioResult" class="hidden mt-8 border-t-2 border-dashed border-amber-800 pt-6">
                 <div class="grid grid-cols-1 md:grid-cols-2 gap-6 text-amber-900">
                    <div id="zodiacDisplay" class="bg-amber-100/50 p-4 rounded-lg border border-amber-300 shadow-inner"></div>
                    <div id="shioDisplay" class="bg-amber-100/50 p-4 rounded-lg border border-amber-300 shadow-inner"></div>
                 </div>
            </div>

        </main>

    </div>
    
    <!-- Footer -->
    <footer class="fixed bottom-4 left-4 right-4 z-20 text-center text-xs text-amber-800/80 pointer-events-none">
        <p>Dibuat dengan ❤️ untuk para kreator di seluruh dunia.</p>
        <p class="mt-1">&copy; <span id="copyright-year"></span> Mufti Restu Mahesa. Semua Hak Cipta Dilindungi.</p>
    </footer>

    <!-- Flatpickr JS -->
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
